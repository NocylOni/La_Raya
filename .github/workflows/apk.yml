name: APK

# Arma el APK de Raya. Corre solo cuando cambia algo que afecta la app.
on:
  push:
    branches: ['**']
    paths:
      - 'La Raya.html'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write             # para adjuntar el APK a un Release con tag

jobs:
  build:
    runs-on: ubuntu-latest    # ya trae el Android SDK preinstalado
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar assets desde el HTML
        run: node tools/prepare-assets.mjs

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensamblar APK debug
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Renombrar
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/raya-${GITHUB_SHA::7}.apk"
          ls -la out

      # Descárgalo desde la pestaña Actions -> este run -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: raya-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # Si empujas un tag v1.0, v1.1, etc., además lo publica como Release
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            APK de Raya (debug, instalable directamente).

            Para instalarlo: descarga el .apk en el celular y ábrelo. Android va a
            pedirte permitir "instalar apps desconocidas" para tu navegador o gestor
            de archivos; es normal con APKs que no vienen de Play Store.
